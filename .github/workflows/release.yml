name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-2022
    env:
      ROOT: ${{ github.workspace }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install Inno Setup
      shell: pwsh
      run: |
        # windows-2022 runners already have Inno Setup pre-installed.
        # Verify ISCC.exe exists; install only if missing.
        $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue
        if (-not $iscc) {
          Write-Host "ISCC not found, installing via chocolatey..."
          choco install innosetup -y --no-progress 2>&1 | Select-Object -Last 3
        }
        $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue
        if ($iscc) {
          Write-Host "ISCC ready: $($iscc.FullName)"
        } else {
          Write-Host "ERROR: ISCC.exe not found after install attempt"
          exit 1
        }

    - name: Restore .NET dependencies
      run: dotnet restore "${{ env.ROOT }}\client\WindowsClient\WindowsClient.csproj"

    - name: Build Rust service (Release)
      run: cargo build --release --manifest-path "${{ env.ROOT }}\service\network-service\Cargo.toml"

    - name: Publish .NET client (MSBuild)
      shell: pwsh
      run: |
        $publishDir = "$env:ROOT\artifacts\client\"
        msbuild "${env:ROOT}\client\WindowsClient\WindowsClient.csproj" `
          /t:Publish /p:Configuration=Release /p:Platform=x64 `
          /p:RuntimeIdentifier=win-x64 /p:SelfContained=true `
          "/p:PublishDir=$publishDir" /p:PublishSingleFile=false `
          /v:minimal
        Write-Host "--- artifacts/client contents ---"
        Get-ChildItem $publishDir | Select-Object Name, Length

    - name: Download Xray core
      shell: pwsh
      run: |
        $xrayVer = "1.8.24"
        $url = "https://github.com/XTLS/Xray-core/releases/download/v$xrayVer/Xray-windows-64.zip"
        Invoke-WebRequest -Uri $url -OutFile "$env:ROOT\xray.zip"
        Expand-Archive -Path "$env:ROOT\xray.zip" -DestinationPath "$env:ROOT\xray" -Force
        $xray = Get-ChildItem "$env:ROOT\xray" -Recurse -Filter "xray.exe" | Select-Object -First 1
        $bindingsDir = "$env:ROOT\artifacts\client\bindings"
        New-Item -ItemType Directory -Path $bindingsDir -Force | Out-Null
        Copy-Item $xray.FullName "$bindingsDir\xray.exe" -Force
        Write-Host "Xray v$xrayVer installed at $bindingsDir"

    - name: Assemble release package
      shell: pwsh
      run: |
        $pkg = "$env:ROOT\artifacts\package"
        $client = "$env:ROOT\artifacts\client"
        New-Item -ItemType Directory -Path "$pkg\bin" -Force | Out-Null
        New-Item -ItemType Directory -Path "$pkg\config" -Force | Out-Null
        New-Item -ItemType Directory -Path "$pkg\logs" -Force | Out-Null
        New-Item -ItemType Directory -Path "$pkg\cache\geoip" -Force | Out-Null

        # DIAGNOSTIC: list client dir contents (find .xbf/.pri)
        Write-Host "=== Diagnostic: artifacts/client key files ==="
        Get-ChildItem $client -Recurse -File | Where-Object {
          $_.Name -match '\.xbf$|\.pri$|\.resources$|WindowsClient\.dll$|WindowsClient\.exe$'
        } | ForEach-Object { "  $([math]::Round($_.Length/1KB,1)) KB  $($_.FullName.Replace($client, ''))" }

        # Copy XAML compiled outputs from obj (MSBuild Publish doesn't copy these!)
        # .xbf  = XAML binary format (required for InitializeComponent & Navigate)
        # .pri  = Package Resource Index (required for ms-appx:/// resource lookup)
        # PowerShell -Include 必须配合 -Recurse 才能生效
        Write-Host "=== Scanning obj for XAML artifacts ==="
        $xamlFiles = Get-ChildItem "$env:ROOT\client\WindowsClient\obj" -Recurse -File -ErrorAction SilentlyContinue |
          Where-Object { $_.Extension -in '.xbf','.pri','.resources' }
        Write-Host "  Found: $($xamlFiles.Count) files"
        foreach ($f in $xamlFiles) {
          $dest = Join-Path $client $f.Name
          Copy-Item $f.FullName $dest -Force
          Write-Host "  Copied $($f.Name) ($([math]::Round($f.Length/1KB,1)) KB) <- $($f.Directory.Name)"
        }

        Copy-Item "$env:ROOT\service\network-service\target\release\network-service.exe" "$pkg\bin\" -Force
        Copy-Item "$client\*" "$pkg\" -Recurse -Force

        @"
        @echo off
        set NC_DATA_DIR=%~dp0
        start "" "WindowsClient.exe"
        "@ | Out-File -FilePath "$pkg\start.cmd" -Encoding ASCII

        $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "manual-build" }
        "version=$tag" | Out-File -FilePath "$pkg\VERSION.txt" -Encoding ASCII

        Write-Host "--- Final package contents ---"
        Get-ChildItem $pkg -Recurse | Where-Object { -not $_.PSIsContainer } | ForEach-Object {
          "  $([math]::Round($_.Length/1MB,1)) MB  $($_.FullName.Replace($pkg + '\', ''))"
        }

    - name: Build Inno Setup installer
      shell: pwsh
      run: |
        $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $isccPath)) {
          $isccPath = (Get-Command iscc -ErrorAction SilentlyContinue).Source
        }
        Write-Host "Using ISCC: $isccPath"
        Write-Host "Working dir: $env:ROOT"

        # 动态替换 .iss 中的版本号
        $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.0-ci" }
        Write-Host "AppVersion: $tag"

        # 从 repo root 运行 ISCC，让 .iss 中相对路径生效
        Push-Location $env:ROOT
        & $isccPath "installer\network-client.iss" "/DAppVersion=$tag" 2>&1
        $exit = $LASTEXITCODE
        Pop-Location
        if ($exit -ne 0) {
          Write-Host "ISCC failed with exit code $exit"
          exit 1
        }

        Write-Host "--- Installer output ---"
        Get-ChildItem "$env:ROOT\artifacts\NetworkClient-Setup-*.exe" |
          Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}}

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: network-client-installer
        path: artifacts/*.exe
        retention-days: 7

    - name: Upload portable zip artifact
      uses: actions/upload-artifact@v4
      with:
        name: network-client-portable
        path: artifacts/package
        retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')

    steps:
    - name: Download installer
      uses: actions/download-artifact@v4
      with:
        name: network-client-installer
        path: release-installer

    - name: Download portable
      uses: actions/download-artifact@v4
      with:
        name: network-client-portable
        path: release-portable

    - name: Create portable zip
      run: |
        cd release-portable
        zip -r ../network-client-x64.zip .
        ls -la ../network-client-x64.zip

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
        name: Network Client ${{ github.ref_name || github.event.inputs.tag_name }}
        body: |
          ## Network Client Windows x64

          - Rust service + WinUI 3 客户端 (self-contained, 无需安装 .NET)
          - 已包含 Xray 内核
          - 安装版 + 便携版两种分发

          ### 安装版 (.exe)
          推荐大多数用户使用。双击 `NetworkClient-Setup-x.y.z-x64.exe` 进入安装向导：
          - 可选安装目录
          - 创建开始菜单 / 桌面快捷方式
          - 支持一键卸载

          ### 便携版 (.zip)
          解压到任意目录，双击 `start.cmd` 即可运行。适合绿色安装 / U 盘随身携带。

          > 系统代理自动设置/还原，TUN 模式需要管理员权限。
        files: |
          release-installer/*.exe
          network-client-x64.zip
