name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-2022
    env:
      ROOT: ${{ github.workspace }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore .NET dependencies
      run: dotnet restore "${{ env.ROOT }}\client\WindowsClient\WindowsClient.csproj"

    - name: Build Rust service (Release)
      run: cargo build --release --manifest-path "${{ env.ROOT }}\service\network-service\Cargo.toml"

    - name: Publish .NET client (MSBuild)
      shell: pwsh
      run: |
        $publishDir = "$env:ROOT\artifacts\client\"
        msbuild "${env:ROOT}\client\WindowsClient\WindowsClient.csproj" `
          /t:Publish /p:Configuration=Release /p:Platform=x64 `
          /p:RuntimeIdentifier=win-x64 /p:SelfContained=true `
          "/p:PublishDir=$publishDir" /p:PublishSingleFile=false `
          /v:minimal
        Write-Host "--- artifacts/client contents ---"
        Get-ChildItem $publishDir | Select-Object Name, Length

    - name: Download Xray core
      shell: pwsh
      run: |
        $xrayVer = "1.8.24"
        $url = "https://github.com/XTLS/Xray-core/releases/download/v$xrayVer/Xray-windows-64.zip"
        Invoke-WebRequest -Uri $url -OutFile "$env:ROOT\xray.zip"
        Expand-Archive -Path "$env:ROOT\xray.zip" -DestinationPath "$env:ROOT\xray" -Force
        $xray = Get-ChildItem "$env:ROOT\xray" -Recurse -Filter "xray.exe" | Select-Object -First 1
        $bindingsDir = "$env:ROOT\artifacts\client\bindings"
        New-Item -ItemType Directory -Path $bindingsDir -Force | Out-Null
        Copy-Item $xray.FullName "$bindingsDir\xray.exe" -Force
        Write-Host "Xray v$xrayVer installed at $bindingsDir"

    - name: Assemble release package
      shell: pwsh
      run: |
        $pkg = "$env:ROOT\artifacts\package"
        $client = "$env:ROOT\artifacts\client"
        New-Item -ItemType Directory -Path "$pkg\bin" -Force | Out-Null
        New-Item -ItemType Directory -Path "$pkg\config" -Force | Out-Null
        New-Item -ItemType Directory -Path "$pkg\logs" -Force | Out-Null
        New-Item -ItemType Directory -Path "$pkg\cache\geoip" -Force | Out-Null

        Copy-Item "$env:ROOT\service\network-service\target\release\network-service.exe" "$pkg\bin\" -Force
        Copy-Item "$client\*" "$pkg\" -Recurse -Force

        @"
        @echo off
        set NC_DATA_DIR=%~dp0
        start "" "bin\WindowsClient.exe"
        "@ | Out-File -FilePath "$pkg\start.cmd" -Encoding ASCII

        $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "manual-build" }
        "version=$tag" | Out-File -FilePath "$pkg\VERSION.txt" -Encoding ASCII

        Write-Host "--- Final package contents ---"
        Get-ChildItem $pkg -Recurse | Where-Object { -not $_.PSIsContainer } | ForEach-Object {
          "  $([math]::Round($_.Length/1MB,1)) MB  $($_.FullName.Replace($pkg + '\', ''))"
        }

    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: network-client-x64
        path: artifacts/package
        retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')

    steps:
    - name: Download package
      uses: actions/download-artifact@v4
      with:
        name: network-client-x64
        path: release-package

    - name: Create zip
      run: |
        cd release-package
        zip -r ../network-client-x64.zip .
        ls -la ../network-client-x64.zip

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
        name: Network Client ${{ github.ref_name || github.event.inputs.tag_name }}
        body: |
          ## Network Client Windows x64

          - Rust service + WinUI 3 客户端
          - 已包含 Xray 内核 (v1.8.24)
          - 解压到任意目录，运行 `start.cmd` 启动

          **首次运行会自动创建 `data/` 目录结构**，订阅 URL 请在设置页添加。

          > 系统代理自动设置/还原，TUN 模式需要管理员权限。
        files: network-client-x64.zip
